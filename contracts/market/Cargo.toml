[package]
name = "market"
version = "1.0.0"
edition = "2021"
rust-version = "1.86"
description = "Market Day: NEP-245 goods, shops priced from stock and demand, run on arena.nearcarta.near."
repository = "https://github.com/nearcarta/nearcarta"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.27.0" }

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
