[package]
name = "house-nft"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nearcarta/nearcarta"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
# Pinned image (rustc 1.86, the last toolchain mainnet accepts for near-sdk 5.x) and its digest.
# `cargo near build reproducible-wasm` rebuilds this crate byte for byte from a pushed commit.
image = "sourcescan/cargo-near:0.20.3-rust-1.86.0"
image_digest = "sha256:a84b7c401a856b6bbbe1975f235b6a8011540a24dfbde248531cccb4b2fdbadf"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi"]

[dependencies]
near-sdk = "=5.27.0"
near-contract-standards = "=5.27.0"

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
