[package]
name = "charter_factory"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/nearcarta/nearcarta"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
near-workspaces = { version = "0.24.0", features = ["unstable"] }
near-primitives = "0.38.0"
near-crypto = "0.38.0"
near-jsonrpc-client = "0.23.0"
near-jsonrpc-primitives = "0.38.0"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
bs58 = "0.5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
