[package]
name = "oath"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/nearcarta/nearcarta"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[features]
default = []
# R14: lean mainnet build without receipt verification and NEP-519 escalation.
lean = []

[dependencies]
near-sdk = "=5.27.0"
hex = "0.4"

[dev-dependencies]
near-workspaces = { version = "0.24.0", features = ["unstable"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

