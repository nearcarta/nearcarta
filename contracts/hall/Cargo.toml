[package]
name = "hall"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/nearcarta/nearcarta"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.27.0" }

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = true
