[package]
name = "charter_board"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/nearcarta/nearcarta"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.27.0"

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true
