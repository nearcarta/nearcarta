[package]
name = "arena_v2"
version = "0.2.0"
edition = "2021"
rust-version = "1.86"
description = "Player-owned guardian pets. Not deployed. The live arena.nearcarta.near account is still v1."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.27.0", features = ["unstable"] }
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["unstable", "unit-testing"] }
# The mock's ed25519 verifier is ed25519-dalek, so the tests sign with the same crate.
ed25519-dalek = "2.2.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
