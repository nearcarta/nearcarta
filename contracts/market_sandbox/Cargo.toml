[package]
name = "market_sandbox"
version = "0.1.0"
edition = "2021"
publish = false

# Market Day against the live board build, in a local near-sandbox.

[dependencies]

[dev-dependencies]
near-workspaces = { version = "0.24.0", features = ["unstable"] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
