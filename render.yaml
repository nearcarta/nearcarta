# Render Blueprint: the read-only API. The live service is a paid Starter instance so it does not sleep.
# It runs the image built from ./Dockerfile (pushed to a private GHCR package), so Render
# needs no access to the repo. Server keys are set on the service, never in the image.
services:
  - type: web
    name: nearcarta-api
    runtime: image
    plan: starter
    region: frankfurt
    image:
      url: ghcr.io/nearcarta/nearcarta-api:latest
      creds:
        fromRegistryCreds:
          name: nearcarta-ghcr
    healthCheckPath: /api/health
    envVars:
      - key: NEAR_RPC
        value: https://free.rpc.fastnear.com
      - key: ONECLICK_PARTNER_KEY
        sync: false
      - key: NEARAI_CLOUD_API_KEY
        sync: false
      - key: NEARAI_MODEL
        value: z-ai/glm-5.3-flash
