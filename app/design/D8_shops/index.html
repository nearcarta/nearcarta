<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nearcarta</title>
<link rel="preload" href="fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link id="tokens" rel="stylesheet" href="../D7_system/tokens/tokens.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="/brand/chrome.css">
<link rel="stylesheet" href="/brand/graphite.css">
<script src="/brand/motion.js" defer></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"../D2_game/vendor/jsm/","../D2_game/vendor/three.module.js":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<canvas id="gl" aria-label="The town. Pick a building to enter it."></canvas>
<header id="top">
  <span id="brand"><img src="/brand/mark.svg" alt="" width="26" height="26"><b>Nearcarta</b></span>
  <a class="ghost back-town" href="/" data-testid="back-town">Back to town</a>
  <button id="back" class="ghost" hidden><span aria-hidden="true">←</span> Street</button>
  <button id="wallet" class="ghost wallet" hidden>Sign in</button>
  <button id="snd" class="icon" aria-label="Sound on or off" title="Sound"></button>
</header>
<nav id="tags" aria-label="Buildings"></nav>
<div id="stags" hidden></div>
<p id="legal">Independent, not affiliated with NEAR Foundation</p>
<section id="tray" hidden aria-live="polite">
  <div class="t-head"><h1 id="t-title"></h1><span id="t-src" class="src"></span></div>
  <p id="t-label" class="label"></p>
  <p id="t-say" class="say" hidden></p>
  <div id="t-hero" class="hero"></div>
  <div id="t-form" class="form" hidden></div>
  <div class="t-row"><button id="t-act" class="act primary"></button></div>
  <p id="t-rcpt" class="rcpt"></p>
  <div class="t-links"><a id="t-more" class="link more" data-testid="hall-proposals" hidden></a><button id="t-rules" class="link" hidden>Your rules</button><button id="t-proof" class="link" aria-controls="drawer" aria-expanded="false">How it works</button></div>
</section>
<aside id="drawer" aria-hidden="true" aria-labelledby="d-title">
  <div class="d-head"><h2 id="d-title">Proof</h2><button id="d-close" class="icon" aria-label="Close proof">✕</button></div>
  <div id="d-body"></div>
</aside>
<aside id="rules" aria-hidden="true" aria-labelledby="r-title">
  <div class="d-head"><h2 id="r-title">Your rules</h2><button id="r-close" class="icon" aria-label="Close rules">✕</button></div>
  <p class="r-lede">I can only act inside these. Your charter checks every ask.</p>
  <div id="r-body"></div>
  <button id="r-sign" class="act primary">Sign my rules</button>
  <p id="r-status" class="rcpt"></p>
</aside>
<div id="load"><span class="ring" aria-hidden="true"></span></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
