<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nearcarta · Town Hall</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../design/D7_system/tokens/tokens.css">
<link rel="stylesheet" href="/brand/chrome.css">
<link rel="stylesheet" href="../vault/vault.css">
<link rel="stylesheet" href="hall.css">
<script src="../../config.js"></script>
</head>
<body data-step="none">
<header class="top">
  <div><a class="back-town" href="/" data-testid="back-town" aria-label="Return to the city">Return to the city</a><h1>Town Hall</h1><p class="sub">The town hall. <span class="net" data-testid="net-badge">mainnet</span></p><p class="muted" id="netnote"></p></div>
  <div class="who"><span id="who"></span>
    <button id="connect" class="primary" data-testid="connect">Sign in</button>
    <button id="signout" hidden>Sign out</button></div>
</header>
<main>
  <section class="card" id="s-file"><h2><span class="num">1</span>File a proposal</h2>
    <form id="file-form">
      <fieldset class="kinds"><legend>What should the DAO vote on?</legend>
        <label><input type="radio" name="kind" value="join" checked data-testid="kind-join"> Add my account to the charter's reward list</label>
        <label><input type="radio" name="kind" value="motion" data-testid="kind-motion"> A motion (text only, no charter change)</label></fieldset>
      <label>Why <textarea id="desc" data-testid="desc" maxlength="280" rows="3" placeholder="I fixed the town map, please add me to the reward round"></textarea></label>
      <p class="muted" id="bond"></p>
      <button class="primary" id="file" data-testid="file" disabled>File proposal</button>
    </form>
    <div class="result" id="result" aria-live="polite" data-testid="result"></div>
    <ul id="log" aria-live="polite"></ul>
  </section>
  <section class="card" id="s-who"><h2><span class="num">2</span>Who decides</h2><div id="facts">Loading…</div></section>
  <section class="card wide" id="s-list"><h2>Latest proposals and motions</h2><div id="list" data-testid="list">Loading…</div></section>
</main>
<script type="module" src="hall.bundle.js"></script>
</body>
</html>
