<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nearcarta · Payouts</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<script src="/config.js"></script>
<script>
try { if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }); } catch (e) {}
try { if (window.caches && caches.keys) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); }); } catch (e) {}
</script>
</head>
<body data-shop="payouts">
<header class="shop-page">
  <p><a class="back-town" href="/" data-testid="back-town">Back to town</a></p>
  <h1>Payouts</h1>
  <p>Pay NEAR rows from the city after setup. This backup page can prepare a list. It does not hold the session key, so Pay here does not send.</p>
</header>
<main class="shop-page">
  <p class="skel" data-testid="payout-skel">Opening the list…</p>
  <div id="app"></div>
</main>
<script type="module" src="/shops/payouts/payouts.bundle.js"></script>
</body>
</html>
