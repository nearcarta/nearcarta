name: ci
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test -- --test-timeout=60000
      - run: npm run verify
      - run: npm run build
  contracts:
    # Unit tests of every crate whose wasm is deployed or shown (near-sdk unit-testing dev-feature).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [oath, arena, toll, townhall, charter_factory, charter_factory_lock, charter_board, house_nft, attested_check]
    steps:
      - uses: actions/checkout@v4
      # charter_board pins rustc 1.86 in rust-toolchain.toml (the wasm mainnet accepted).
      # The other crates stay on 1.95. RUSTUP_TOOLCHAIN would hide the file, so set it per crate.
      - uses: dtolnay/rust-toolchain@1.86.0
        if: matrix.crate == 'charter_board'
      - uses: dtolnay/rust-toolchain@1.95.0
        if: matrix.crate != 'charter_board'
      - run: cd contracts/${{ matrix.crate }} && cargo test --lib --locked
  factory-sandbox:
    # Local near-sandbox: publish the committed charter as a global contract, deploy the factory,
    # create a charter through it and drive it (no testnet, no keys).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: wasm32-unknown-unknown }
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cd contracts/charter_factory && cargo near build non-reproducible-wasm --locked
      - run: cd contracts/charter_factory && cargo test --test sandbox --locked
  oath-sandbox:
    # Local near-sandbox: build the charter and the reaper from source, then run every
    # integration suite (rules, attacks, properties, refusals, teardown). No testnet, no keys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
        with: { targets: wasm32-unknown-unknown }
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      # near-sdk 5.x targets protocol < 84, so cargo-near requires rustc <= 1.86 for the wasm.
      - run: cd contracts/oath && cargo +1.86.0 near build non-reproducible-wasm --locked
      - run: cd contracts/reaper && cargo +1.86.0 near build non-reproducible-wasm --locked --no-abi
      - run: cd contracts/oath && cargo test --locked --test sandbox --test exploits --test props --test adversarial --test teardown
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # gitleaks CLI (MIT); the gitleaks GitHub Action needs a paid license for org repos.
      - run: curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - run: ./gitleaks git --config .gitleaks.toml --redact --no-banner .
