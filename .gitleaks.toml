# Default rules. Narrow allowlists for known false positives only.
[extend]
useDefault = true

[[allowlists]]
description = "build output and a minified third-party parser (token class names)"
paths = ['''(^|/)target/''', '''^app/dist/''', '''vendor/jsm/libs/chevrotain\.module\.min\.js$''']

[[allowlists]]
description = "public NEAR testnet tx hashes (base58, 43-44 chars) in the deployments file"
regexTarget = "line"
regexes = ['''^\s*"[a-z0-9_]+": "[1-9A-HJ-NP-Za-km-z]{43,44}",?$''']
