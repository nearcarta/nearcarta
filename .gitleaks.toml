# Default rules. Narrow allowlists for known false positives only.
[extend]
useDefault = true

[[allowlists]]
description = "build output and a minified third-party parser (token class names)"
paths = ['''(^|/)target/''', '''^app/dist/''', '''vendor/jsm/libs/chevrotain\.module\.min\.js$''']

[[allowlists]]
description = "public NEAR tx hashes (base58, 43-44 chars) in the readme, docs, deployments and judges notes. A 64-byte key is about 88 chars and stays flagged."
paths = ['''^README\.md$''', '''^docs/.*\.md$''', '''^shared/deployments/.*\.json$''', '''^judges/''']
regexTarget = "match"
regexes = ['''\b[1-9A-HJ-NP-Za-km-z]{43,44}\b''']

[[allowlists]]
description = "public NEAR tx hashes (base58, 43-44 chars) in the deployments file"
regexTarget = "line"
regexes = ['''^\s*"[a-z0-9_]+": "[1-9A-HJ-NP-Za-km-z]{43,44}",?$''']

[[allowlists]]
description = "NEP-171 deed token ids are the holder's public NEAR account id"
regexTarget = "line"
regexes = ['''^\s*"token_id": "([a-z\d]+[-_])*[a-z\d]+(\.([a-z\d]+[-_])*[a-z\d]+)*\.near",?$''']

[[allowlists]]
description = "NEAR RPC error text 'access key ed25519:<public key>': a 32-byte public key (<=44 base58 chars); 64-byte private keys (~88 chars) stay flagged"
regexTarget = "match"
regexes = ['''(?i)access key ed25519:[1-9A-HJ-NP-Za-km-z]{1,44}\s*$''']

[[allowlists]]
description = "Public USDC contract address (an address, not a secret)"
regexTarget = "match"
regexes = ['''(?i)0x036cbd53842c5426634e7929541ec2318f3dcf7e''']

[[allowlists]]
description = "a NEAR public key named in a log line ('key ed25519:<32-byte key>', <=44 base58 chars); 64-byte private keys (~88 chars) stay flagged"
regexTarget = "match"
regexes = ['''(?i)\bkey ed25519:[1-9A-HJ-NP-Za-km-z]{43,44}\s*$''']

[[allowlists]]
description = "Vault Arena attempt labels in shared/arena/prompts.js (\"key\": \"<CODE>_<words>\"), plain ids, not secrets"
paths = ['''^shared/arena/prompts\.js$''']
regexTarget = "line"
regexes = ['''^\s*"key": "[A-Z][A-Z0-9]*_[a-z_]+",?$''']
